services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    depends_on:
      - redis
    ports:
      - "3000:3000"
      - "3036:3036"
    env_file:
      - .env.dev
    environment:
      RAILS_ENV: "development"
      NODE_ENV: "development"
      BUNDLE_WITHOUT: "${BUNDLE_WITHOUT:-development:test}"
      VITE_RUBY_AUTO_BUILD: "true"
      DOWNLOAD_CACHE_REDIS_URL: "${DOWNLOAD_CACHE_REDIS_URL:-redis://redis:6379/0}"
      DOWNLOAD_CACHE_REDIS_POOL_SIZE: "${DOWNLOAD_CACHE_REDIS_POOL_SIZE:-5}"
      DOWNLOAD_CACHE_REDIS_TIMEOUT: "${DOWNLOAD_CACHE_REDIS_TIMEOUT:-1}"
      IIIF_IMAGE_BASE: "${IIIF_IMAGE_BASE:-https://image-tor.canadiana.ca/iiif/2}"
    volumes:
      - .:/app
    command:
      - sh
      - -lc
      - |
        set -e
        bundle check
        if [ -f package.json ] && [ ! -d node_modules/vite ]; then yarn install --immutable; fi
        rm -f tmp/pids/server.pid
        bundle exec rails db:prepare
        yarn vite --host 0.0.0.0 --port 3036 &
        bundle exec rails server -b 0.0.0.0 -p 3000

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DOWNLOAD_CACHE_REDIS_PORT:-7001}:6379"
    volumes:
      - redis_data:/data

volumes:
  node_modules:
  redis_data:

